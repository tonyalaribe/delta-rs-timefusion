name: DataFusion contract validation

on:
  pull_request:
    paths:
      - .github/patches/datafusion-sort-pushdown-contract.patch
      - .github/workflows/datafusion-contract.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: datafusion-contract
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: tonyalaribe/datafusion
          ref: 158e8405f8bdfcc144468ad8940d6dfcda22b623
          path: datafusion-contract
          submodules: recursive
      - name: Apply proposed contract change before committing DataFusion
        run: git apply ../.github/patches/datafusion-sort-pushdown-contract.patch
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606
        with:
          toolchain: stable
          components: rustfmt,clippy
          cache: false
      - name: Format check
        run: cargo fmt --all --check
      - name: Required Clippy checks
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Ordering optimizer regressions
        run: cargo test -p datafusion --test core physical_optimizer::enforce_sorting
      - name: Contributor lint suite
        run: ./dev/rust_lint.sh
